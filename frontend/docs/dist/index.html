      })();

e.js, Python, Ruby, and PHP."},{type:"callout",variant:"info",text:"New to Cartly? Start with the Quickstart guide to create your first product and complete a test checkout in under ten minutes."},{type:"heading",level:2,text:"Base URL",id:"base-url"},{type:"paragraph",text:"All API requests are made over HTTPS to the following base URL. Requests made over plain HTTP will fail."},{type:"code",code:{curl:"https://api.cartly.dev/v1"}},{type:"heading",level:2,text:"The Cartly object model",id:"object-model"},{type:"paragraph",text:"Every resource in Cartly is represented as a JSON object with a stable `id`, an `object` field describing its type, and a `created` Unix timestamp. Core resources you'll work with:"},{type:"table",headers:["Resource","Description"],rows:[["Product","A sellable item in your catalog, containing one or more variants."],["Variant","A specific purchasable version of a product (size, color, SKU, price, stock)."],["Customer","A shopper, with saved addresses and order history."],["Cart","A mutable collection of line items building up to a checkout."],["Order","An immutable record created once a cart is successfully checked out."],["PaymentIntent","Tracks the lifecycle of collecting payment for an order."],["Discount","A coupon or automatic promotion applied to carts and orders."],["Event","A webhook-delivered notification that something changed."]]},{type:"heading",level:2,text:"Client libraries",id:"libraries"},{type:"paragraph",text:"Official libraries wrap the HTTP API with idiomatic, typed helpers and automatic retries. Every code sample in these docs can be toggled between cURL, Node.js, Python, Ruby, and PHP using the language switcher above each snippet."},{type:"code",title:"Install the SDK",code:{curl:`# The HTTP API works with any language.
# No installation required — just an API key.`,node:"npm install @cartly/node",python:"pip install cartly",ruby:"gem install cartly",php:"composer require cartly/cartly-php"}},{type:"heading",level:2,text:"Environments",id:"environments"},{type:"paragraph",text:"Every account has two modes: test and live. Test mode data is fully isolated from live mode — carts, orders, and payments created in test mode never touch real money and are periodically cleared. Toggle modes from the dashboard, or simply use a test (`sk_test_`) or live (`sk_live_`) API key."}]},{slug:"authentication",group:Vn,title:"Authentication",description:"Authenticate requests to the Cartly API using your secret API key.",blocks:[{type:"paragraph",text:"The Cartly API uses API keys to authenticate requests. You can view and manage your keys in the dashboard under Developers → API keys. Keys are scoped to test or live mode, and can optionally be restricted to a subset of resources."},{type:"callout",variant:"warning",text:"Your secret keys carry many privileges, so keep them safe. Never expose them in client-side code, mobile apps, or public repositories."},{type:"heading",level:2,text:"Making authenticated requests",id:"making-requests"},{type:"paragraph",text:"Provide your secret key in the `Authorization` header as a Bearer token on every request. Authentication is not performed via query string or cookies."},{type:"code",title:"Fetch your account",code:{curl:`curl https://api.cartly.dev/v1/account \\
  -H "Authorization: Bearer sk_test_51Hn8...vX2"`,node:`import Cartly from "@cartly/node";

const cartly = new Cartly("sk_test_51Hn8...vX2");

const account = await cartly.account.retrieve();
console.log(account);`,python:`import cartly

cartly.api_key = "sk_test_51Hn8...vX2"

account = cartly.Account.retrieve()
print(account)`,ruby:`require "cartly"
Cartly.api_key = "sk_test_51Hn8...vX2"

puts account`,php:`require_once "vendor/autoload.php";

$account = \\Cartly\\Account::retrieve();
echo $account;`},response:`{
  "id": "acct_1Nk29d",
  "object": "account",
  "business_name": "Acme Supply Co.",
  "mode": "test",
  "default_currency": "usd"
}`},{type:"heading",level:2,text:"Publishable vs. secret keys",id:"key-types"},{type:"table",headers:["Key type","Prefix","Use case"],rows:[["Secret key","sk_test_ / sk_live_","Server-side only. Full access to your account."],["Publishable key","pk_test_ / pk_live_","Safe to embed in client-side code. Used with Cartly.js to tokenize card details."],["Restricted key","rk_test_ / rk_live_","Secret key scoped to specific resources and read/write permissions."]]},{type:"heading",level:2,text:"Idempotent requests",id:"idempotency"},{type:"paragraph",text:"POST requests that create resources (carts, orders, payment intents) accept an `Idempotency-Key` header. Reusing the same key within 24 hours guarantees the operation is performed only once, which is essential when retrying requests after a network failure."},{type:"code",code:{curl:`curl https://api.cartly.dev/v1/orders \\
  -H "Authorization: Bearer sk_test_51Hn8...vX2" \\
  -H "Idempotency-Key: order-checkout-8f14e45"`,node:`await cartly.orders.create(
  { cart: "cart_1P2q3R" },

)`,php:`\\Cartly\\Order::create(

  "id": "order_7Zc9Ke",
  "object": "order",
  "status": "paid",
  "total": 3600,
  "currency": "usd",
  "customer_email": "ada@example.com"
}`},{type:"callout",variant:"success",text:"That's it — you've created a product and completed an end-to-end test purchase. Continue to Guides to learn about inventory, customers, discounts, and webhooks."}]},{slug:"errors",group:Vn,title:"Errors",description:"Cartly uses conventional HTTP response codes and a consistent error object.",blocks:[{type:"paragraph",text:"Cartly returns standard HTTP status codes to indicate the success or failure of a request. Codes in the 2xx range indicate success; 4xx codes indicate an error caused by the request (missing parameters, invalid state, failed payment); 5xx codes indicate an error on Cartly's end."},{type:"table",headers:["Status","Meaning"],rows:[["200 OK","The request succeeded."],["201 Created","The resource was created successfully."],["400 Bad Request","The request was unacceptable, often due to a missing or malformed parameter."],["401 Unauthorized","No valid API key was provided."],["402 Payment Required","The payment attempt failed (e.g. card declined)."],["403 Forbidden","The API key doesn't have permission to perform the request."],["404 Not Found","The requested resource doesn't exist."],["409 Conflict","The request conflicts with the current state of the resource (e.g. out of stock)."],["429 Too Many Requests","Too many requests hit the API too quickly."],["500, 502, 503, 504","Something went wrong on Cartly's servers."]]},{type:"heading",level:2,text:"The error object",id:"error-object"},{type:"code",title:"Example error response",code:{curl:`HTTP/1.1 402 Payment Required
Content-Type: application/json`},response:`{
  "error": {
    "type": "card_error",
    "code": "card_declined",

    "param": "payment_method",

  }
}`},{type:"table",headers:["Type","Description"],rows:[["api_error","An error on Cartly's servers. These are rare."],["authentication_error","Cartly could not authenticate the request."],["card_error","The card couldn't be charged for some reason."],["invalid_request_error","The request had invalid parameters."],["idempotency_error","The idempotency key was reused with a different request payload."],["rate_limit_error","Too many requests hit the API too quickly."]]},{type:"heading",level:2,text:"Handling errors in code",id:"handling-errors"},{type:"code",code:{node:`try {
  await cartly.checkouts.complete({ cart: "cart_1P2q3R", paymentMethod: "pm_card_chargeDeclined" });
} catch (err) {
  if (err.type === "card_error") {
    console.log("Declined:", err.message);
  } else {
    throw err;
  }
}`,python:`try:
    cartly.Checkout.complete(cart="cart_1P2q3R", payment_method="pm_card_chargeDeclined")
except cartly.error.CardError as e:
    print("Declined:", e.user_message)`,ruby:`begin
  Cartly::Checkout.complete(cart: "cart_1P2q3R", payment_method: "pm_card_chargeDeclined")
rescue Cartly::CardError => e
  puts "Declined: #{e.message}"

  echo "Declined: " . $e->getMessage();
}`}},{type:"callout",variant:"info",text:"Every response includes a request_id. Include it when contacting support so we can pull up the exact request."}]},{slug:"pagination-rate-limits",group:Vn,title:"Pagination & rate limits",description:"List endpoints are paginated with cursors; requests are subject to rate limits.",blocks:[{type:"heading",level:2,text:"Cursor pagination",id:"cursor-pagination"},{type:"paragraph",text:"All top-level list endpoints (`/products`, `/orders`, `/customers`, ...) share a common pagination scheme, sorted by creation date, newest first. Pass `limit` (default 10, max 100) to control page size, and `starting_after` or `ending_before` with an object id to page forwards or backwards."},{type:"code",code:{curl:`curl "https://api.cartly.dev/v1/orders?limit=3&starting_after=order_7Zc9Ke" \\
  -H "Authorization: Bearer sk_test_51Hn8...vX2"`,node:'const page = await cartly.orders.list({ limit: 3, startingAfter: "order_7Zc9Ke" });',python:'page = cartly.Order.list(limit=3, starting_after="order_7Zc9Ke")',ruby:'page = Cartly::Order.list(limit: 3, starting_after: "order_7Zc9Ke")',php:'$page = \\Cartly\\Order::all(["limit" => 3, "starting_after" => "order_7Zc9Ke"]);'},response:`{
  "object": "list",
  "url": "/v1/orders",
  "has_more": true,
  "data": [ { "id": "order_8bYqLz", "object": "order" } ]
}`},{type:"heading",level:2,text:"Rate limits",id:"rate-limits"},{type:"paragraph",text:"The API allows up to 100 read requests per second and 50 write requests per second per account in live mode (lower in test mode). Every response includes headers describing your current usage."},{type:"table",headers:["Header","Description"],rows:[["X-RateLimit-Limit","The maximum number of requests permitted in the current window."],["X-RateLimit-Remaining","Requests remaining in the current window."],["Retry-After","Seconds to wait before retrying, present on 429 responses."]]},{type:"callout",variant:"warning",text:"Implement exponential backoff when you receive a 429. All official client libraries do this automatically."},{type:"heading",level:2,text:"Expanding responses",id:"expanding"},{type:"paragraph",text:"Many endpoints return an id for related objects by default. Use the `expand` parameter to inline nested resources and avoid an extra round trip."},{type:"code",code:{curl:`curl "https://api.cartly.dev/v1/orders/order_7Zc9Ke?expand[]=customer&expand[]=payment_intent" \\
  -H "Authorization: Bearer sk_test_51Hn8...vX2"`,node:`const order = await cartly.orders.retrieve("order_7Zc9Ke", {
  expand: ["customer", "payment_intent"],
});`,python:'order = cartly.Order.retrieve("order_7Zc9Ke", expand=["customer", "payment_intent"])',ruby:'order = Cartly::Order.retrieve("order_7Zc9Ke", expand: ["customer", "payment_intent"])',php:'$order = \\Cartly\\Order::retrieve(["id" => "order_7Zc9Ke", "expand" => ["customer", "payment_intent"]]);'}}]}],Ql="Guides",tg=[{slug:"guide-products",group:Ql,title:"Products & inventory",description:"Model your catalog with products, variants, and real-time inventory tracking.",blocks:[{type:"paragraph",text:"A Product represents something you sell — a T-shirt, a course, a subscription box. A product rarely has just one purchasable form, so Cartly splits the sellable unit out into Variants, each with its own SKU, price, and stock count."},{type:"heading",level:2,text:"Products vs. variants",id:"products-vs-variants"},{type:"list",items:["Product — shared metadata: name, description, images, category, tags.","Variant — the actual purchasable thing: price, currency, SKU, option values (e.g. Size: M, Color: Black), and inventory.","Every product must have at least one variant, even if it has no real options."]},{type:"code",title:"Create a product with multiple variants",code:{curl:`curl https://api.cartly.dev/v1/products \\
  -H "Authorization: Bearer sk_test_51Hn8...vX2" \\
  -H "Content-Type: application/json" \\
  -d '{
    "name": "Classic Tee",
    "options": ["Size", "Color"],
    "variants": [
      { "name": "S / Black", "price": 2500, "sku": "TEE-S-BLK", "inventory": 40, "option_values": { "Size": "S", "Color": "Black" } },
      { "name": "M / Black", "price": 2500, "sku": "TEE-M-BLK", "inventory": 65, "option_values": { "Size": "M", "Color": "Black" } }
    ]
  }'`,node:`const product = await cartly.products.create({
  name: "Classic Tee",
  options: ["Size", "Color"],
  variants: [
    { name: "S / Black", price: 2500, sku: "TEE-S-BLK", inventory: 40, optionValues: { Size: "S", Color: "Black" } },
    { name: "M / Black", price: 2500, sku: "TEE-M-BLK", inventory: 65, optionValues: { Size: "M", Color: "Black" } },
  ],
});`,python:`product = cartly.Product.create(
    name="Classic Tee",
    options=["Size", "Color"],
    variants=[
        {"name": "S / Black", "price": 2500, "sku": "TEE-S-BLK", "inventory": 40,
         "option_values": {"Size": "S", "Color": "Black"}},
        {"name": "M / Black", "price": 2500, "sku": "TEE-M-BLK", "inventory": 65,
         "option_values": {"Size": "M", "Color": "Black"}},
    ],
)`},response:`{
  "id": "prod_QwMk21",
  "object": "product",
  "name": "Classic Tee",
  "variants": [
    { "id": "var_a1", "sku": "TEE-S-BLK", "inventory": 40 },
    { "id": "var_a2", "sku": "TEE-M-BLK", "inventory": 65 }
  ]
}`},{type:"heading",level:2,text:"Tracking inventory",id:"tracking-inventory"},{type:"paragraph",text:"Set `inventory_policy` on a variant to control what happens at zero stock. `deny` blocks further sales; `continue` allows overselling (useful for made-to-order items). Inventory is decremented automatically when an order is created, and restored if the order is later canceled or refunded."},{type:"code",title:"Adjust stock manually",code:{curl:`curl https://api.cartly.dev/v1/variants/var_a1/inventory \\
  -H "Authorization: Bearer sk_test_51Hn8...vX2" \\
  -H "Content-Type: application/json" \\
  -d '{ "adjustment": -5, "reason": "damaged_in_warehouse" }'`,node:`await cartly.variants.adjustInventory("var_a1", {
  adjustment: -5,
  reason: "damaged_in_warehouse",
});`,python:'cartly.Variant.adjust_inventory("var_a1", adjustment=-5, reason="damaged_in_warehouse")'}},{type:"callout",variant:"info",text:"Subscribe to the inventory.low_stock webhook event to get notified when a variant drops below its configured threshold."},{type:"heading",level:2,text:"Archiving vs. deleting",id:"archiving"},{type:"paragraph",text:"Products referenced by past orders can never be deleted, to preserve historical order data. Instead, set `active: false` to hide a product from listing endpoints and your storefront while keeping it fully intact for reporting."}]},{slug:"guide-customers",group:Ql,title:"Customers & accounts",description:"Store shopper profiles, addresses, and payment methods for faster repeat checkout.",blocks:[{type:"paragraph",text:"A Customer object represents a shopper. Attaching a customer to a cart or order lets you save addresses, view order history, and store reusable payment methods for one-click future purchases. Customers are optional — guest checkout works without ever creating one."},{type:"code",title:"Create a customer",code:{curl:`curl https://api.cartly.dev/v1/customers \\
  -H "Authorization: Bearer sk_test_51Hn8...vX2" \\
  -H "Content-Type: application/json" \\
  -d '{
    "email": "ada@example.com",
    "name": "Ada Lovelace",
    "shipping_address": {
      "line1": "12 King St", "city": "London", "postal_code": "WC2E", "country": "GB"
    }
  }'`,node:`const customer = await cartly.customers.create({
  email: "ada@example.com",
  name: "Ada Lovelace",
  shippingAddress: {
    line1: "12 King St",
    city: "London",
    postalCode: "WC2E",
    country: "GB",
  },
});`,python:`customer = cartly.Customer.create(
    email="ada@example.com",
    name="Ada Lovelace",
    shipping_address={"line1": "12 King St", "city": "London", "postal_code": "WC2E", "country": "GB"},
)`},response:`{
  "id": "cus_5aRk9c",
  "object": "customer",
  "email": "ada@example.com",
  "name": "Ada Lovelace",
  "default_payment_method": null
}`},{type:"heading",level:2,text:"Saving a payment method for later",id:"saved-payment-methods"},{type:"paragraph",text:"Pass `save_payment_method: true` on a checkout to attach the card used to the customer for future purchases, then reference it directly on the next checkout to skip re-entering card details."},{type:"code",code:{curl:`curl https://api.cartly.dev/v1/checkouts \\
  -H "Authorization: Bearer sk_test_51Hn8...vX2" \\
  -H "Content-Type: application/json" \\
  -d '{
    "cart": "cart_9Pz1",
    "customer": "cus_5aRk9c",
    "payment_method": "pm_card_visa",
    "save_payment_method": true
  }'`,node:`await cartly.checkouts.complete({
  cart: "cart_9Pz1",
  customer: "cus_5aRk9c",
  paymentMethod: "pm_card_visa",
  savePaymentMethod: true,
});`}},{type:"heading",level:2,text:"Looking up a customer's orders",id:"customer-orders"},{type:"code",code:{curl:`curl "https://api.cartly.dev/v1/orders?customer=cus_5aRk9c" \\
  -H "Authorization: Bearer sk_test_51Hn8...vX2"`,node:'const orders = await cartly.orders.list({ customer: "cus_5aRk9c" });',python:'orders = cartly.Order.list(customer="cus_5aRk9c")'}},{type:"callout",variant:"warning",text:"Emails aren't required to be unique. If you rely on email as a lookup key, search first with GET /customers?email= before creating a new record to avoid duplicates."}]},{slug:"guide-checkout",group:Ql,title:"Carts & checkout",description:"Build a cart, apply discounts and shipping, then convert it into a paid order.",blocks:[{type:"paragraph",text:"A Cart is a mutable, temporary object that holds line items while a shopper is browsing. Carts expire automatically after 14 days of inactivity. Once a shopper is ready to pay, you complete a Checkout, which validates stock, calculates totals, charges a payment method, and produces an immutable Order."},{type:"heading",level:2,text:"1. Build the cart",id:"build-cart"},{type:"code",code:{curl:`curl https://api.cartly.dev/v1/carts \\
  -H "Authorization: Bearer sk_test_51Hn8...vX2" \\
  -H "Content-Type: application/json" \\
  -d '{ "line_items": [{ "variant": "var_a1", "quantity": 1 }] }'`,node:`const cart = await cartly.carts.create({
  lineItems: [{ variant: "var_a1", quantity: 1 }],
});`}},{type:"heading",level:2,text:"2. Update quantities or add items",id:"update-cart"},{type:"code",code:{curl:`curl https://api.cartly.dev/v1/carts/cart_9Pz1/line_items \\
  -H "Authorization: Bearer sk_test_51Hn8...vX2" \\
  -H "Content-Type: application/json" \\
  -d '{ "variant": "var_a2", "quantity": 2 }'`,node:'await cartly.carts.addLineItem("cart_9Pz1", { variant: "var_a2", quantity: 2 });'}},{type:"heading",level:2,text:"3. Apply a discount code",id:"apply-discount"},{type:"code",code:{curl:`curl https://api.cartly.dev/v1/carts/cart_9Pz1/discounts \\
  -H "Authorization: Bearer sk_test_51Hn8...vX2" \\
  -H "Content-Type: application/json" \\
  -d '{ "code": "WELCOME10" }'`,node:'await cartly.carts.applyDiscount("cart_9Pz1", { code: "WELCOME10" });'}},{type:"heading",level:2,text:"4. Set shipping method",id:"set-shipping"},{type:"code",code:{curl:`curl https://api.cartly.dev/v1/carts/cart_9Pz1 \\
  -H "Authorization: Bearer sk_test_51Hn8...vX2" \\
  -H "Content-Type: application/json" \\
  -d '{ "shipping_method": "ship_standard" }'`,node:'await cartly.carts.update("cart_9Pz1", { shippingMethod: "ship_standard" });'}},{type:"heading",level:2,text:"5. Complete checkout",id:"complete-checkout"},{type:"paragraph",text:"Completing a checkout is atomic: if payment fails, the cart is left untouched so the shopper can try another payment method. On success, the cart is closed and an Order is created with a snapshot of prices, quantities, and addresses at the time of purchase."},{type:"code",code:{curl:`curl https://api.cartly.dev/v1/checkouts \\
  -H "Authorization: Bearer sk_test_51Hn8...vX2" \\
  -H "Content-Type: application/json" \\
  -d '{ "cart": "cart_9Pz1", "payment_method": "pm_card_visa", "email": "ada@example.com" }'`,node:`const order = await cartly.checkouts.complete({
  cart: "cart_9Pz1",
  paymentMethod: "pm_card_visa",
  email: "ada@example.com",
});`},response:'{ "id": "order_7Zc9Ke", "object": "order", "status": "paid", "total": 4300 }'},{type:"callout",variant:"info",text:"Prefer a hosted page? POST /checkout_sessions returns a `url` you can redirect shoppers to — Cartly hosts the entire payment form for you and redirects back to your success_url on completion."}]},{slug:"guide-orders",group:Ql,title:"Orders & fulfillment",description:"Track order status from payment through shipment and delivery.",blocks:[{type:"paragraph",text:"An Order is created once a checkout completes successfully and is immutable with respect to pricing — but its `status` and `fulfillment_status` evolve as you pack and ship items."},{type:"heading",level:2,text:"Order lifecycle",id:"order-lifecycle"},{type:"table",headers:["status","Meaning"],rows:[["pending","Payment is processing (e.g. bank redirect methods)."],["paid","Payment succeeded; ready to fulfill."],["fulfilled","All items have shipped."],["canceled","Order was canceled before fulfillment."],["refunded","Payment was fully refunded."]]},{type:"heading",level:2,text:"Creating a fulfillment",id:"creating-fulfillment"},{type:"paragraph",text:"Create a fulfillment when you ship some or all of an order's line items. Include a carrier and tracking number so Cartly can send shipment notification emails and expose tracking to the customer."},{type:"code",code:{curl:`curl https://api.cartly.dev/v1/orders/order_7Zc9Ke/fulfillments \\
  -H "Authorization: Bearer sk_test_51Hn8...vX2" \\
  -H "Content-Type: application/json" \\
  -d '{
    "line_items": [{ "variant": "var_a1", "quantity": 1 }],
    "carrier": "ups",
    "tracking_number": "1Z999AA10123456784"
  }'`,node:`await cartly.orders.createFulfillment("order_7Zc9Ke", {
  lineItems: [{ variant: "var_a1", quantity: 1 }],
  carrier: "ups",
  trackingNumber: "1Z999AA10123456784",
});`,python:`cartly.Order.create_fulfillment(
    "order_7Zc9Ke",
    line_items=[{"variant": "var_a1", "quantity": 1}],
    carrier="ups",
    tracking_number="1Z999AA10123456784",
)`},response:'{ "id": "ful_2mQpz", "object": "fulfillment", "status": "shipped", "tracking_url": "https://track.example/1Z999AA10123456784" }'},{type:"heading",level:2,text:"Cancellations & refunds",id:"cancellations-refunds"},{type:"paragraph",text:"Canceling an unfulfilled order automatically voids or refunds its payment and restocks inventory. To refund only part of an order (e.g. one damaged item), create a partial refund instead."},{type:"code",code:{curl:`curl https://api.cartly.dev/v1/orders/order_7Zc9Ke/refunds \\
  -H "Authorization: Bearer sk_test_51Hn8...vX2" \\
  -H "Content-Type: application/json" \\
  -d '{ "amount": 1800, "reason": "requested_by_customer" }'`,node:`await cartly.orders.refund("order_7Zc9Ke", {
  amount: 1800,
  reason: "requested_by_customer",
});`}},{type:"callout",variant:"info",text:"Listen for order.fulfilled and order.refunded webhook events to keep your own systems (email, ERP, analytics) in sync without polling."}]},{slug:"guide-payments",group:Ql,title:"Payments",description:"Collect card payments and wallets with PaymentIntents and Cartly.js.",blocks:[{type:"paragraph",text:"Cartly handles the full payment lifecycle through the PaymentIntent object, which tracks a payment attempt from creation through authorization, capture, and potential failure. Most integrations never touch PaymentIntents directly — the Checkout API creates and confirms one automatically — but they're available for custom flows."},{type:"heading",level:2,text:"Tokenizing card details client-side",id:"tokenizing"},{type:"paragraph",text:"Never send raw card numbers to your server. Use Cartly.js in the browser with your publishable key to exchange card details for a single-use payment method token."},{type:"code",title:"Cartly.js in the browser",code:{node:`import { loadCartly } from "@cartly/js";

const cartly = await loadCartly("pk_test_51Hn8...aB3");
const elements = cartly.elements();
const card = elements.create("card");
card.mount("#card-element");

const { paymentMethod, error } = await cartly.createPaymentMethod({
  type: "card",
  card,
});`}},{type:"heading",level:2,text:"Creating and confirming manually",id:"manual-payment-intent"},{type:"code",code:{curl:`curl https://api.cartly.dev/v1/payment_intents \\
  -H "Authorization: Bearer sk_test_51Hn8...vX2" \\
  -H "Content-Type: application/json" \\
  -d '{ "amount": 4300, "currency": "usd", "payment_method": "pm_1Nk3aB", "confirm": true }'`,node:`const intent = await cartly.paymentIntents.create({
  amount: 4300,
  currency: "usd",
  paymentMethod: "pm_1Nk3aB",
  confirm: true,
});`,python:`intent = cartly.PaymentIntent.create(
    amount=4300, currency="usd", payment_method="pm_1Nk3aB", confirm=True
)`},response:'{ "id": "pi_3Nk29d", "object": "payment_intent", "status": "succeeded", "amount": 4300 }'},{type:"heading",level:2,text:"Handling 3D Secure / additional authentication",id:"3ds"},{type:"paragraph",text:"Some cards require step-up authentication. When this happens the PaymentIntent's status is `requires_action` and includes a `next_action.redirect_url`. Redirect the shopper there, then poll or wait for a webhook to confirm the final status."},{type:"table",headers:["status","Meaning"],rows:[["requires_payment_method","No payment method attached yet, or the last attempt failed."],["requires_action","Additional customer action needed, such as 3D Secure."],["processing","Payment is being processed (common for bank debits)."],["succeeded","Funds have been captured."],["canceled","The intent was canceled before completion."]]},{type:"callout",variant:"warning",text:"Test 3D Secure flows with the card number 4000 0025 0000 3155, which always triggers a challenge in test mode."}]},{slug:"guide-webhooks",group:Ql,title:"Webhooks",description:"Receive real-time notifications when orders, payments, and inventory change.",blocks:[{type:"paragraph",text:"Webhooks let Cartly push events to your server the moment something happens, instead of you polling the API. Register an endpoint URL in the dashboard (or via the API), select which event types you care about, and Cartly will POST a JSON payload for each one."},{type:"heading",level:2,text:"Registering an endpoint",id:"registering-endpoint"},{type:"code",code:{curl:`curl https://api.cartly.dev/v1/webhook_endpoints \\
  -H "Authorization: Bearer sk_test_51Hn8...vX2" \\
  -H "Content-Type: application/json" \\
  -d '{
    "url": "https://example.com/webhooks/cartly",
    "enabled_events": ["order.paid", "order.fulfilled", "inventory.low_stock"]
  }'`,node:`const endpoint = await cartly.webhookEndpoints.create({
  url: "https://example.com/webhooks/cartly",
  enabledEvents: ["order.paid", "order.fulfilled", "inventory.low_stock"],
});`},response:'{ "id": "we_2pQmXa", "object": "webhook_endpoint", "secret": "whsec_9f8e...c1", "status": "enabled" }'},{type:"heading",level:2,text:"Verifying signatures",id:"verifying-signatures"},{type:"paragraph",text:"Every webhook request includes a `Cartly-Signature` header. Always verify it using your endpoint's signing secret before trusting the payload, to protect against spoofed requests."},{type:"code",title:"Express.js webhook handler",code:{node:`import express from "express";
import { cartly } from "./cartly.js";

const app = express();

app.post(
  "/webhooks/cartly",
  express.raw({ type: "application/json" }),
  (req, res) => {
    const signature = req.headers["cartly-signature"];
    let event;
    try {
      event = cartly.webhooks.constructEvent(
        req.body,
        signature,
        process.env.CARTLY_WEBHOOK_SECRET
      );
    } catch (err) {
      return res.status(400).send('Webhook Error: ' + err.message);
    }

    if (event.type === "order.paid") {
      console.log("Order paid:", event.data.object.id);
    }

    res.json({ received: true });
  }
);`,python:`import cartly
from flask import Flask, request

app = Flask(__name__)

@app.route("/webhooks/cartly", methods=["POST"])
def webhook():
    payload = request.data
    sig = request.headers.get("Cartly-Signature")
    try:
        event = cartly.Webhook.construct_event(payload, sig, WEBHOOK_SECRET)
    except ValueError:
        return "Invalid payload", 400

    if event["type"] == "order.paid":
        print("Order paid:", event["data"]["object"]["id"])

    return "", 200`}},{type:"heading",level:2,text:"Common event types",id:"common-events"},{type:"table",headers:["Event","Description"],rows:[["cart.created","A new cart was started."],["order.paid","An order's payment succeeded."],["order.fulfilled","All line items on an order have shipped."],["order.refunded","An order was fully or partially refunded."],["payment_intent.payment_failed","A payment attempt failed."],["inventory.low_stock","A variant fell below its low-stock threshold."],["customer.created","A new customer record was created."]]},{type:"callout",variant:"info",text:"Endpoints must respond with a 2xx status within 10 seconds. Cartly retries failed deliveries with exponential backoff for up to 3 days."}]}],ll="API reference",ag=[{slug:"api-products",group:ll,title:"Products",description:"Create and manage catalog items and their variants.",blocks:[{type:"heading",level:2,text:"The product object",id:"the-object"},{type:"table",headers:["Attribute","Type","Description"],rows:[["id","string","Unique identifier, prefixed with prod_."],["name","string","Display name of the product."],["description","string","Long-form description, supports plain text."],["active","boolean","Whether the product is visible on listing endpoints."],["options","array",'Names of variant options, e.g. ["Size", "Color"].'],["variants","array","Expandable list of variant objects."],["images","array","List of image URLs."],["created","timestamp","Time the product was created."]]},{type:"heading",level:2,text:"Create a product",id:"create"},{type:"paragraph",text:"POST /v1/products"},{type:"code",code:{curl:`curl https://api.cartly.dev/v1/products \\

import Cartly from "@cartly/node";

const app = express();
app.use(express.json());
const cartly = new Cartly(process.env.CARTLY_SECRET_KEY);

app.post("/checkout", async (req, res) => {
  const { items, discountCode, paymentMethod, email } = req.body;

  try {
    const cart = await cartly.carts.create({
      lineItems: items.map((i) => ({ variant: i.variantId, quantity: i.qty })),
    });

    if (discountCode) {
      await cartly.carts.applyDiscount(cart.id, { code: discountCode });
    }

    const order = await cartly.checkouts.complete(
      { cart: cart.id, paymentMethod, email },
      { idempotencyKey: req.headers["x-request-id"] }
    );

    res.status(201).json({ orderId: order.id, status: order.status, total: order.total });
  } catch (err) {
    if (err.type === "card_error") {
      return res.status(402).json({ error: err.message });
    }
    console.error(err);
    res.status(500).json({ error: "Something went wrong" });
  }
});

async function syncInventory() {
  const counts = await fetchWarehouseCounts(); // [{ sku, quantity }]

  for (const { sku, quantity } of counts) {
    const { data: variants } = await cartly.variants.list({ sku });
    if (!variants.length) continue;

    const variant = variants[0];
    if (variant.inventory !== quantity) {
      await cartly.variants.setInventory(variant.id, { quantity });
      console.log(\`Updated \${sku}: \${variant.inventory} -> \${quantity}\`);
    }
  }
}

export function useCart() {
  const [cart, setCart] = useState(null);

  useEffect(() => {
    const cartId = localStorage.getItem("cartId");
    if (cartId) {
      fetch(\`/api/cart/\${cartId}\`).then((r) => r.json()).then(setCart);
    }
  }, []);

  const addItem = useCallback(async (variantId, quantity = 1) => {
    const res = await fetch("/api/cart/add", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ cartId: cart?.id, variantId, quantity }),
    });
    const updated = await res.json();
    localStorage.setItem("cartId", updated.id);
    setCart(updated);
  }, [cart]);

  return { cart, addItem };
}`}},{type:"code",title:"AddToCartButton.tsx",code:{node:`import { useCart } from "./useCart";

export function AddToCartButton({ variantId }: { variantId: string }) {
  const { addItem } = useCart();
  const [loading, setLoading] = useState(false);

  return (
    <button
      disabled={loading}
      onClick={async () => {
        setLoading(true);
        await addItem(variantId, 1);
        setLoading(false);
      }}
    >
      {loading ? "Adding..." : "Add to cart"}
    </button>
  );
}`}},{type:"code",title:"api/cart/add.js — backend route used above",code:{node:`import Cartly from "@cartly/node";
const cartly = new Cartly(process.env.CARTLY_SECRET_KEY);

export default async function handler(req, res) {
  const { cartId, variantId, quantity } = req.body;

  const cart = cartId
    ? await cartly.carts.addLineItem(cartId, { variant: variantId, quantity })
